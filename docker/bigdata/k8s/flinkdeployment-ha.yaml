# HA demo FlinkDeployment - 2 JobManager replicas with Kubernetes-native
# leader election (high-availability.type: kubernetes).
#
# Storage: an NFS-backed StorageClass ("nfs-client", via
# nfs-subdir-external-provisioner pointed at an NFS export on the kind host
# itself - see the provisioner's helm install) rather than kind's default
# local-path StorageClass. local-path was confirmed live to strand this
# deployment on node failure: it binds a PV to whichever single node first
# claims it (WaitForFirstConsumer), so when that node goes down the PV goes
# down with it and Kubernetes has nowhere else to reschedule the pods to.
# NFS-backed storage lives outside all kind nodes, on the host, so any node
# can mount it - this is what actually lets a FlinkDeployment survive losing
# the node it happened to be scheduled on.
#
# Uses the Flink image's own bundled example job (StateMachineExample) - the
# point of this deployment is proving the HA mechanism itself (leader
# failover, checkpoint recovery), not running this project's actual CDC
# sink jars on Kubernetes.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: flink-ha-storage
  namespace: flink
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: nfs-client
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: flink-checkpoints
  namespace: flink
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: nfs-client
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: flink-savepoints
  namespace: flink
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: nfs-client
  resources:
    requests:
      storage: 2Gi
---
apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: flink-ha-demo
  namespace: flink
spec:
  image: flink:1.19.3
  flinkVersion: v1_19
  serviceAccount: flink
  flinkConfiguration:
    taskmanager.numberOfTaskSlots: "2"
    high-availability.type: kubernetes
    high-availability.storageDir: file:///opt/flink/ha
    kubernetes.operator.periodic-savepoint.interval: 10m
    state.checkpoints.dir: file:///opt/flink/checkpoints
    state.savepoints.dir: file:///opt/flink/savepoints
    execution.checkpointing.interval: "30s"
  podTemplate:
    spec:
      containers:
        - name: flink-main-container
          volumeMounts:
            - mountPath: /opt/flink/ha
              name: flink-ha-storage
            - mountPath: /opt/flink/checkpoints
              name: flink-checkpoints
            - mountPath: /opt/flink/savepoints
              name: flink-savepoints
      volumes:
        - name: flink-ha-storage
          persistentVolumeClaim:
            claimName: flink-ha-storage
        - name: flink-checkpoints
          persistentVolumeClaim:
            claimName: flink-checkpoints
        - name: flink-savepoints
          persistentVolumeClaim:
            claimName: flink-savepoints
  jobManager:
    replicas: 2
    resource:
      memory: "1024m"
      cpu: 1
  taskManager:
    resource:
      memory: "1024m"
      cpu: 1
  job:
    jarURI: local:///opt/flink/examples/streaming/StateMachineExample.jar
    parallelism: 2
    upgradeMode: savepoint
    state: running
