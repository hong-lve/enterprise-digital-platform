# The Flink Kubernetes Operator manages FlinkDeployment resources, but the
# JobManager pods it creates do their own separate Kubernetes API calls for
# HA (creating/updating the leader-election ConfigMap, managing their own
# TaskManager pods) - that needs its own ServiceAccount with permissions
# scoped to the flink namespace, distinct from the operator's own RBAC
# (which the Helm chart already sets up for the operator pod itself).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flink
  namespace: flink
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flink
  namespace: flink
rules:
  - apiGroups: [""]
    resources: ["pods", "configmaps", "services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flink-role-binding
  namespace: flink
subjects:
  - kind: ServiceAccount
    name: flink
    namespace: flink
roleRef:
  kind: Role
  name: flink
  apiGroup: rbac.authorization.k8s.io
