auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Local single-instance dev stack, not a real multi-tenant deployment -
  # loosened so a burst of container startup logs (Flink/Kafka Connect are
  # both noisy on boot) doesn't get rate-limited and silently dropped.
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
