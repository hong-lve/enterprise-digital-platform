global:
  scrape_interval: 15s

scrape_configs:
  # data-platform-service runs directly on the host (not containerized, see
  # docker/bigdata/README.md), not reachable by container name the way the
  # other bigdata-* targets would be - host.docker.internal is Docker
  # Desktop's own DNS entry for reaching the host from inside a container.
  - job_name: data-platform-service
    metrics_path: /api/actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8085"]
