apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-service-platform-service
  namespace: data-platform
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: data-service-platform-service
  template:
    metadata:
      labels:
        app: data-service-platform-service
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: service
          image: ghcr.io/hong-lve/data-service-platform-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8087
          envFrom:
            - configMapRef:
                name: data-service-platform-config
            - secretRef:
                name: data-service-platform-secrets
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 45
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            failureThreshold: 30
            periodSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: data-service-platform-service
  namespace: data-platform
  labels:
    app: data-service-platform-service
spec:
  selector:
    app: data-service-platform-service
  ports:
    - name: http
      port: 8087
      targetPort: http
