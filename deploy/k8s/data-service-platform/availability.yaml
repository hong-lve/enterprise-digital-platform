apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: data-service-platform-service
  namespace: data-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: data-service-platform-service
  minReplicas: 3
  maxReplicas: 12
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: data-service-platform-service
  namespace: data-platform
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: data-service-platform-service
