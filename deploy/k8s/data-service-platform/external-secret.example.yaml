apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: data-service-platform-secrets
  namespace: data-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: enterprise-secret-store
  target:
    name: data-service-platform-secrets
    creationPolicy: Owner
  data:
    - secretKey: MYSQL_USERNAME
      remoteRef:
        key: data-service/production
        property: mysqlUsername
    - secretKey: MYSQL_PASSWORD
      remoteRef:
        key: data-service/production
        property: mysqlPassword
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: data-service/production
        property: redisPassword
    - secretKey: DATA_SERVICE_MASTER_KEY
      remoteRef:
        key: data-service/production
        property: masterKey
